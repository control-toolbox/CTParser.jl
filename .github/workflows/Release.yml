name: Release

# A release from its request (`release.jl request`) to its close; see CTActions
# docs/workflows/release.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'The version whose request starts the release (empty: a wake-up)'
        required: false
        type: string
  pull_request:
    types: [labeled]
  workflow_run:
    workflows: [CI, Documentation, Breakage, Release gate, Release tag]
    types: [completed]
    branches: ['release/v*', main]
  schedule:
    - cron: '23 * * * *'

jobs:
  call:
    permissions:
      contents: write
      issues: write
      pull-requests: read
      actions: write
      checks: read
    # TRIAL: the branch of control-toolbox/CTActions#154; back to @main once it is merged
    uses: control-toolbox/CTActions/.github/workflows/release.yml@feat/128-release-finish
    with:
      version: ${{ inputs.version }}
      ctactions_ref: feat/128-release-finish
